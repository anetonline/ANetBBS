; docker/single/supervisord.conf
;
; Single-container "quick start" process manager. Each [program:] stanza
; mirrors the equivalent deploy/anetbbs-*.service unit that install.sh
; generates for a traditional bare-metal install (command= <-> ExecStart=,
; directory= <-> WorkingDirectory=, autorestart=true + startretries=
; <-> Restart=always/RestartSec=), so restart/backoff behavior matches
; what sysops already understand from systemd.
;
; stopasgroup/killasgroup=true matters for the eventlet (web) and asyncio
; (terminal) processes, which spawn worker threads/greenlets -- ensures
; the whole process group gets SIGTERM, not just the immediate child.

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:web]
command=python /app/deploy/serve.py
directory=/app
user=anetbbs
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:terminal]
; `anetbbs` console-script entry point (setup.py) was an editable
; install (`pip install -e .`) built against /src in the builder
; stage, but the runtime image's actual package lives at /app (see
; docker/Dockerfile) -- the console-script shim's own sys.path[0] is
; the DIRECTORY THE SCRIPT LIVES IN (/usr/local/bin), not the CWD, so
; `directory=/app` alone doesn't fix it. Invoking the module directly
; with `python -m` instead sidesteps the broken editable-install shim
; entirely and makes startup independent of how the package was
; installed -- found by testing against a real Docker daemon: without
; this, every start failed with "ModuleNotFoundError: No module named
; 'anetbbs'".
command=python -m anetbbs.main
directory=/app
user=anetbbs
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mrc-bridge]
command=python -m mrc.bridge.main
directory=/app
user=anetbbs
autostart=true
autorestart=true
