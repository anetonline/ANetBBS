     ask after a live Pi3 comparison against NetRunner's own MSDOS
     font: the bitmap font's glyph strokes read as thin/blurry at this
     client's render size, where a real vector face stays crisp and
     "pops" the way a period-correct DOS/BBS terminal font should.

     generic "Courier New"/system monospace fonts don't reliably keep
     consistent glyph widths for that range (confirmed live: a mis-
     metriced border glyph visibly drifted out of its cell). Block
     Elements (full/half-block/shade characters) are still drawn as
     direct canvas geometric fills regardless of which font is loaded

  :root {
    --bg: #000814;
    --fg: #c8d6e5;
    --accent: #39d0d8;
    --accent-dim: #1f6b70;
    --btn-bg: #0c2b3a;
    --btn-border: #39d0d8;
    --btn-hover: #163f52;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    height: 100%; overflow: hidden;
    font-family: 'IBM VGA', 'Courier New', ui-monospace, monospace;
  }
  #status {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 4px 10px; font-size: 12px; letter-spacing: 0.04em;
    background: #050c14; border-bottom: 1px solid var(--accent-dim);
    color: var(--accent);
  }
  #wrap {
    position: absolute; top: 28px; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: var(--bg); image-rendering: pixelated;
    /* Real bug found live (Pi3 test, 2026-10-02): the canvas's native
       pixel size (COLS*CHAR_W x ROWS*CHAR_H, currently 1440x800) used
       to display at that exact CSS size, simply flex-centered in
       #wrap between the fixed status/hint bars -- on a browser
       viewport a little shorter than that (plus the status/hint
       bars' own height), the centered canvas overflowed equally top
       and bottom and #wrap/body's overflow:hidden silently clipped
       both edges (the top of a bordered splash screen and the
       bottom hint-bar row both lost a sliver). max-width/max-height
       100% + auto width/height scales the canvas DOWN via CSS (never
       up past its native size) only by exactly as much as the
       viewport actually demands -- image-rendering: pixelated keeps
       that scale crisp (nearest-neighbor, no blur) the same way it
       already does for the 2x native-font upscale inside the canvas
       itself. A tall-enough viewport still gets the full native
       1440x800 render, unclipped and unscaled.
    */
    max-width: 100%; max-height: 100%; width: auto; height: auto;
  }
  #menu {
    position: absolute; top: 28px; left: 0; right: 0; bottom: 0;
    display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 24px; padding: 24px;
  }
  #menu h1 {
    color: var(--accent); font-size: 1.4em; letter-spacing: 0.08em;
    margin: 0 0 8px 0; text-transform: uppercase;
    text-shadow: 0 0 12px rgba(57, 208, 216, 0.5);
  }
  #menu-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px; max-width: 900px; width: 100%;
  }
  #menu-grid button {
    position: relative; overflow: hidden;
    font-family: inherit; font-size: 1em; padding: 16px 14px;
    background: linear-gradient(160deg, var(--btn-bg) 0%, #081c27 100%);
    color: var(--fg); border: 2px solid var(--btn-border);
    border-radius: 6px; cursor: pointer; text-align: left;
    box-shadow: 0 0 0 rgba(57, 208, 216, 0), inset 0 0 12px rgba(57, 208, 216, 0.06);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  }
  #menu-grid button::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 40%, rgba(57, 208, 216, 0.14) 50%, transparent 60%);
    transform: translateX(-120%);
    transition: transform 0.5s ease;
  }
  #menu-grid button:hover, #menu-grid button:focus {
    background: linear-gradient(160deg, var(--btn-hover) 0%, #0c2d3d 100%);
    outline: none; transform: translateY(-2px);
    box-shadow: 0 4px 18px rgba(57, 208, 216, 0.25), inset 0 0 16px rgba(57, 208, 216, 0.12);
    border-color: #7af0f6;
  }
  #menu-grid button:hover::before, #menu-grid button:focus::before {
    transform: translateX(120%);
  }
  #menu-grid button:active {
    transform: translateY(0); box-shadow: 0 0 10px rgba(57, 208, 216, 0.3);
  }
  #menu-grid button .hk {
    display: inline-block; color: var(--bg); background: var(--accent);
    font-weight: bold; margin-right: 10px; padding: 1px 7px; border-radius: 3px;
    text-shadow: none; box-shadow: 0 0 8px rgba(57, 208, 216, 0.5);
  }
  #hint {
    position: fixed; bottom: 4px; left: 0; right: 0; text-align: center;
    font-size: 11px; color: var(--accent-dim);
  }
</style>
</head>
<body>
<div id="status">ANetBBS Enhanced Client -- connecting...</div>
<div id="wrap"><canvas id="term" width="960" height="600"></canvas></div>
<div id="menu">
  <h1 id="menu-title"></h1>
  <div id="menu-grid"></div>
</div>
<div id="hint">Click a menu item, or just type -- keystrokes go straight to the BBS like any other terminal.</div>
<script>
(function () {
  'use strict';

  // Bumped by hand on every client-side change -- lets a screenshot
  // (or a sysop's bug report) instantly confirm whether a fix is
  // actually deployed/loaded (not served from a stale browser cache)
  // instead of guessing from visual comparison alone.
  var CLIENT_BUILD = 'build-7-no-clip';

  // 18x32 = a clean 2x multiple of the IBM VGA font's native 9x16
  // bitmap metrics -- rendered via the offscreen-canvas technique
  // below, not drawn directly at 32px (see _drawRunPixelPerfect()'s
  // own docstring for why).
  var COLS = 80, ROWS = 25, CHAR_W = 18, CHAR_H = 32;
  var NATIVE_CW = 9, NATIVE_CH = 16;  // the font's actual bitmap grid
  var SCALE = CHAR_W / NATIVE_CW;
  var canvas = document.getElementById('term');
  var ctx = canvas.getContext('2d');
  canvas.width = COLS * CHAR_W;
  canvas.height = ROWS * CHAR_H;
  var lines = [''];

  var statusEl = document.getElementById('status');
  var menuEl = document.getElementById('menu');
  var menuTitleEl = document.getElementById('menu-title');
  var menuGridEl = document.getElementById('menu-grid');

  // Real bug found live (Pi3 test, two separate screenshots): drawing
  // this bitmap font directly at 32px (CHAR_H, a scaled-up size) made
  // the browser's own font rasterizer anti-alias every glyph -- fine
  // for a normal vector font, but it leaves a faint blended/semi-
  // transparent seam between adjacent glyphs instead of them tiling
  // edge-to-edge, which showed up as a regular grid of hairline gaps
  // through every solid block-art fill and shading run (visibly a
  // "speckled" pattern, not the solid continuous bars Synchronet/
  // NetRunner/SyncTerm show for the exact same CP437 bytes). The
  // font's hinting is tuned for its own native 16px grid, where a
  // real rasterizer snaps outlines to whole pixels instead of
  // smoothing them -- confirmed by this project's own debug preview
  // tooling (anetbbs/features/ansi_png.py's PNG export, and the ad
  // hoc script used to verify this exact font during development):
  // both render via PIL/FreeType at native 16px THEN nearest-neighbor
  // upscale, and never showed this gap at all.
  //
  // Fixed the same way: render each run into an offscreen canvas at
  // the font's true native size (no scaling, no anti-aliasing seams),
  // then copy it onto the visible canvas with imageSmoothingEnabled
  // = false (nearest-neighbor, pixel-doubling -- no blur, no
  // blending) instead of ever asking the font rasterizer to draw at
  // a non-native size directly.
  var _glyphCanvas = document.createElement('canvas');
  var _glyphCtx = _glyphCanvas.getContext('2d');
  _glyphCtx.font = NATIVE_CH + 'px "IBM VGA", "Courier New", monospace';
  _glyphCtx.textBaseline = 'top';

  function _hexToRgb(hex) {
    var h = (hex || '#aaaaaa').replace('#', '');
    if (h.length === 3) { h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; }
    var num = parseInt(h, 16);
    // NOT `|| 0xaaaaaa` -- 0 (true black, '#000000') is falsy in JS,
    // so that would have silently replaced black with gray. isNaN()
    // only catches a genuinely unparseable string.
    if (isNaN(num)) { num = 0xaaaaaa; }
    return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
  }

  // CP437 Block Elements (U+2580-2593): drawn as direct geometric
  // fills, never through the font. Real bug found live (Pi3 test):
  // a side-by-side SyncTerm comparison against the EXACT SAME
  // welcome.ans/robot pixel-art content was the evidence that finally
  // pinned this down -- SyncTerm renders these as perfectly solid,
  // gap-free regions; the IBM VGA font's own glyph outlines for them,
  // as rasterized by the BROWSER's font engine, don't fill their cell
  // edge-to-edge (common for a bitmap-derived TrueType/WOFF
  // conversion, where a glyph's actual ink doesn't always exactly
  // match its advance-width box). This is NOT the antialiasing
  // problem the earlier native-size-render + alpha-threshold fix
  // targeted -- that fix correctly eliminated blurry/blended edges
  // but had ZERO effect on this gap, which is the real tell it's a
  // different root cause: the font's own glyph genuinely doesn't
  // cover the full cell, by the font's own design, not by blur. No
  // amount of anti-aliasing cleanup can fix a glyph that's honestly
  // smaller than its cell. Real terminal emulators (SyncTerm
  // included) never trust ANY font for these specific characters --
  // they draw them as geometric primitives instead, same as this.
  function _drawBlockChar(ch, x, y, w, h, fg) {
    switch (ch) {
      case '█': ctx.fillStyle = fg; ctx.fillRect(x, y, w, h); return true;
      case '▀': ctx.fillStyle = fg; ctx.fillRect(x, y, w, Math.ceil(h / 2)); return true;
      case '▄': ctx.fillStyle = fg; ctx.fillRect(x, y + Math.floor(h / 2), w, Math.ceil(h / 2)); return true;
      case '▌': ctx.fillStyle = fg; ctx.fillRect(x, y, Math.ceil(w / 2), h); return true;
      case '▐': ctx.fillStyle = fg; ctx.fillRect(x + Math.floor(w / 2), y, Math.ceil(w / 2), h); return true;
      case '░': _drawShade(x, y, w, h, fg, 1); return true;  // light ~25%
      case '▒': _drawShade(x, y, w, h, fg, 2); return true;  // medium ~50%
      case '▓': _drawShade(x, y, w, h, fg, 3); return true;  // dark ~75%
    }
    return false;
  }

  function _drawShade(x, y, w, h, fg, level) {
    // A crisp dither pattern at native-pixel granularity (one dot per
    // NATIVE_CW/NATIVE_CH sub-cell), matching the traditional CP437
    // shade-character bit patterns, instead of a blended low-alpha
    // fill -- an alpha fill would reintroduce exactly the blending
    // problem the rest of this function exists to avoid.
    var dotW = w / NATIVE_CW, dotH = h / NATIVE_CH;
    ctx.fillStyle = fg;
    for (var ry = 0; ry < NATIVE_CH; ry++) {
      for (var rx = 0; rx < NATIVE_CW; rx++) {
        var on = (level === 1) ? ((rx + ry) % 4 === 0)
               : (level === 2) ? ((rx + ry) % 2 === 0)
               : ((rx + ry) % 4 !== 0);
        if (on) {
          ctx.fillRect(x + rx * dotW, y + ry * dotH, Math.ceil(dotW), Math.ceil(dotH));
        }
      }
    }
  }

  function _drawGlyphPixelPerfect(ch, destX, destY, fg) {
    // Same native-size-render + hard-alpha-threshold + nearest-
    // neighbor-scale technique as before (see the removed block
    // comment this replaced, still correct for everything that ISN'T
    // a block element -- box-drawing/text glyphs already render
    // cleanly this way, confirmed via the lightbar/login menu
    // screenshots), just applied one character at a time now that
    // block elements are split off to their own geometric path above.
    _glyphCanvas.width = NATIVE_CW;
    _glyphCanvas.height = NATIVE_CH;
    _glyphCtx.font = NATIVE_CH + 'px "IBM VGA", "Courier New", monospace';
    _glyphCtx.textBaseline = 'top';
    _glyphCtx.fillStyle = fg || '#aaaaaa';
    _glyphCtx.fillText(ch, 0, 0);

    var imgData = _glyphCtx.getImageData(0, 0, NATIVE_CW, NATIVE_CH);
    var px = imgData.data;
    var rgb = _hexToRgb(fg);
    for (var p = 0; p < px.length; p += 4) {
      if (px[p + 3] >= 128) {
        px[p] = rgb[0]; px[p + 1] = rgb[1]; px[p + 2] = rgb[2]; px[p + 3] = 255;
      } else {
        px[p] = 0; px[p + 1] = 0; px[p + 2] = 0; px[p + 3] = 0;
      }
    }
    _glyphCtx.putImageData(imgData, 0, 0);

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(_glyphCanvas, 0, 0, NATIVE_CW, NATIVE_CH,
                  destX, destY, CHAR_W, CHAR_H);
  }

  function _drawRunPixelPerfect(text, destX, destY, fg, bg) {
    if (!text) return;
    var w = text.length * NATIVE_CW;
    if (bg) {
      ctx.fillStyle = bg;
      ctx.fillRect(destX, destY, w * SCALE, NATIVE_CH * SCALE);
    }
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      var cx = destX + i * CHAR_W;
      if (_drawBlockChar(ch, cx, destY, CHAR_W, CHAR_H, fg || '#aaaaaa')) {
        continue;
      }
      _drawGlyphPixelPerfect(ch, cx, destY, fg);
    }
  }

  function redrawTerm() {
    ctx.fillStyle = '#000814';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    var visible = lines.slice(Math.max(0, lines.length - ROWS));
    for (var i = 0; i < visible.length; i++) {
      _drawRunPixelPerfect(visible[i], 4, i * CHAR_H, '#c8d6e5', null);
    }
  }

  function appendText(s) {
    var parts = String(s).split(/\r\n|\r|\n/);
    lines[lines.length - 1] += parts[0];
    for (var i = 1; i < parts.length; i++) {
      lines.push(parts[i]);
    }
    if (lines.length > 2000) {
      lines = lines.slice(lines.length - 2000);
    }
    redrawTerm();
  }

  // Real ANSI-art screens (welcome banner etc.) -- server already
  // parsed SGR colors / cursor-positioning into a row/run grid (see
  // enhanced_protocol.encode_screen(), built on top of
  // anetbbs.features.ansi_html's existing VT parser), so this is just
  // drawing colored text runs at fixed cell positions -- no ANSI
  // parsing happens client-side at all.
  function drawScreen(rows) {
    ctx.fillStyle = '#000814';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // _drawRunPixelPerfect() draws every character at its own
    // explicitly computed native-grid x position (fixing a real bug
    // where box-drawing glyphs don't keep a consistent advance width
    // in every font, confirmed live: a border row visibly drifted
    // right of its cell grid when drawn as one whole-string fillText()
    // call) AND renders at the font's true native size before scaling
    // (fixing the inter-glyph anti-aliasing seam bug -- see that
    // function's own docstring) -- both real, live-found bugs fixed
    // by the same chokepoint.
    (rows || []).forEach(function (row) {
      var y = row.row * CHAR_H;
      if (y > canvas.height) return;
      (row.runs || []).forEach(function (run) {
        _drawRunPixelPerfect(run.text || '', run.col * CHAR_W, y, run.fg, run.bg);
      });
    });
  }

  function showMenu(title, items) {
    menuTitleEl.textContent = title || '';
    menuGridEl.innerHTML = '';
    (items || []).forEach(function (it) {
      var btn = document.createElement('button');
      var hk = document.createElement('span');
      hk.className = 'hk';
      hk.textContent = '[' + it.hotkey + ']';
      btn.appendChild(hk);
      btn.appendChild(document.createTextNode(it.label || ''));
      btn.addEventListener('click', function () {
        // 'send' (when the server provided one -- see
        // enhanced_protocol.encode_menu()'s own docstring) is what
        // actually gets typed on click, e.g. "16\r" for a read_line()-
        // based multi-digit choice menu; falls back to the displayed
        // hotkey itself for the common single-keystroke case.
        send({ type: 'click', hotkey: (it.send !== undefined ? it.send : it.hotkey) });
      });
      menuGridEl.appendChild(btn);
    });
    menuEl.style.display = 'flex';
    document.getElementById('wrap').style.display = 'none';
  }

  function hideMenu() {
    menuEl.style.display = 'none';
    document.getElementById('wrap').style.display = 'flex';
  }

  var proto = (location.protocol === 'https:') ? 'wss:' : 'ws:';
  var ws = new WebSocket(proto + '//' + location.host + '/ws');

  function send(obj) {
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(obj));
    }
  }

  ws.addEventListener('open', function () {
    statusEl.textContent = 'ANetBBS Enhanced Client (' + CLIENT_BUILD + ') -- connected';
    // Pass the server's bot-defense gate (real users press a key before
    // the login screen appears) -- see session.py's _bot_gate().
    send({ type: 'key', ch: ' ' });
  });

  ws.addEventListener('message', function (ev) {
    var msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (!msg || typeof msg !== 'object') return;
    switch (msg.type) {
      case 'clear':
        lines = [''];
        redrawTerm();
        break;
      case 'text':
        hideMenu();
        appendText(msg.s || '');
        break;
      case 'menu':
        showMenu(msg.title, msg.items);
        break;
      case 'screen':
        hideMenu();
        lines = [''];
        drawScreen(msg.rows);
        break;
      case 'cursor':
        break;
      default:
        break;
    }
  });

  ws.addEventListener('close', function () {
    statusEl.textContent = 'ANetBBS Enhanced Client -- disconnected';
  });
  ws.addEventListener('error', function () {
    statusEl.textContent = 'ANetBBS Enhanced Client -- connection error';
  });

  // Maps to the exact byte sequences anetbbs/core/session.py's
  // _bot_gate() (bare ESC/'*') and read_key_arrow() (CSI sequences)
  // already parse for every other terminal client -- sent as ONE
  // "key" message per keypress so the adapter buffers the whole
  // sequence atomically (see _WSReaderAdapter in enhanced_server.py),
  // matching how a real terminal emits an arrow key as one write().
  var SPECIAL_KEYS = {
    Escape: '\x1b',
    ArrowUp: '\x1b[A',
    ArrowDown: '\x1b[B',
    ArrowRight: '\x1b[C',
    ArrowLeft: '\x1b[D',
    Home: '\x1b[H',
    End: '\x1b[F',
    PageUp: '\x1b[5~',
    PageDown: '\x1b[6~',
    Delete: '\x1b[3~',
    Insert: '\x1b[2~',
    Tab: '\t'
  };

  document.addEventListener('keydown', function (e) {
    var ch = null;
    if (e.key === 'Enter') {
      ch = '\r';
    } else if (e.key === 'Backspace') {
      ch = '\x7f';
    } else if (Object.prototype.hasOwnProperty.call(SPECIAL_KEYS, e.key)) {
      ch = SPECIAL_KEYS[e.key];
    } else if (e.key.length === 1) {
      ch = e.key;
    }
    if (ch !== null) {
      e.preventDefault();
      send({ type: 'key', ch: ch });
    }
  });
})();
</script>
</body>
</html>
