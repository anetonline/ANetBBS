{% extends "base.html" %}

{% block title %}New Postcard{% endblock %}

{% block content %}
<div class="bbs-header">
    <h1><i class="bi bi-postcard"></i> New Postcard</h1>
    <p class="text-muted">Compose some retro ANSI/PETSCII art and get a public link + image you can share anywhere.</p>
</div>

<form method="post" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card-body">
        <div class="row g-2 mb-3">
            <div class="col-md-6">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" required
                       placeholder="Greetings from ANetBBS!">
            </div>
            <div class="col-md-3">
                <label class="form-label">Width</label>
                <input type="number" name="width" class="form-control" value="60" min="20" max="100">
            </div>
            <div class="col-md-3">
                <label class="form-label">Height</label>
                <input type="number" name="height" class="form-control" value="20" min="5" max="40">
            </div>
        </div>
        <button class="btn btn-primary"><i class="bi bi-easel"></i> Open Editor</button>
        <a href="{{ url_for('postcards.index') }}" class="btn btn-link">Cancel</a>
    </div>
</form>
{% endblock %}
