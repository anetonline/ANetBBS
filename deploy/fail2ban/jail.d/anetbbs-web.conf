# fail2ban jail for ANetBBS web login rate-limit (429) responses.
# Bans the source IP at the firewall level after 3 rate-limit hits in 10 min.
# The BBS itself also writes a permanent IpBan row on the first rate-limit
# trip, so this is a belt-and-suspenders layer.
#
# Adjust logpath to match your nginx access log location.

[anetbbs-web]
enabled  = true
filter   = anetbbs-web
logpath  = /var/log/nginx/access.log
maxretry = 3
findtime = 600
bantime  = 86400
action   = iptables-multiport[name=anetbbs-web, port="80,443,2233,2234", protocol=tcp]
