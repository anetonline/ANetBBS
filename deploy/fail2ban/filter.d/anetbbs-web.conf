# fail2ban filter for ANetBBS web login rate-limit responses.
# Matches nginx access log lines where ANetBBS returned 429 on /auth/login.
# The BBS auto-bans at 10 attempts / 5 min in its own IpBan table, but
# fail2ban adds a kernel-level firewall block for persistent abusers.
#
# Install:
#   sudo cp deploy/fail2ban/filter.d/anetbbs-web.conf /etc/fail2ban/filter.d/
#   sudo cp deploy/fail2ban/jail.d/anetbbs-web.conf   /etc/fail2ban/jail.d/
#   sudo systemctl reload fail2ban
#
# Test filter: sudo fail2ban-regex /var/log/nginx/access.log /etc/fail2ban/filter.d/anetbbs-web.conf

[INCLUDES]
before = common.conf

[Definition]
# nginx combined log format:
#   IP - - [date] "METHOD /path HTTP/1.x" STATUS size "ref" "ua"
failregex = ^<HOST> .* "POST /auth/login HTTP/\d[^ ]* 429
ignoreregex =
