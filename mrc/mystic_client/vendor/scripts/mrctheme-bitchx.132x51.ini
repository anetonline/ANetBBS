// Theme: BitchX - Version 1.3
//
// ANSI file template
// 132 x 51 (132 x 52 minus status bar)
// Can now only use 1 ANSI per width, then height can adapt automatically
// You still require a separate INI for each size
ANSIFILE=mrc-bitchx.132.ans

// Ansi file needs to be saved by lines and be (Terminal width - 1)
// This way, we can reuse the same ANSI for all screen heights
//
// Numbers are as follows:
// First Line, Number of Lines, Display X, Display Y, InitialFGClr
// Example: Starting line 1, read 4 lines and place this content at position 1,1
TOPANSI=1,1,1,1,1
BOTANSI=4,1,1,50,1
HELPANSI1=6,21,29,15,1
HELPANSI2=28,21,29,15,1
WELCOMEANSI=50,21,29,15,1

// Highlight (Colors for markings - only use last 2 bytes for fg/bg)
MARKGOOD=0,0,0,15,18
MARKWARN=0,0,0,15,22
MARKCRIT=0,0,0,15,20

// Chat mandatory elements
// Display X, Display Y, Length, Color1, Color2
INPUT=2,51,129,7,0
DIRECT=2,51,129,15,20
CHATTL=2,3,130,7,0
CHATBL=2,49,130,7,0

// Display X, Display Y, Length, NickFG, Background
NICKTL=1,2,131,7,17
// Display X, Display Y, Length, BracketFG, BracketBG
NICKBL=1,2,131,8,17

// Chat optional elements
// Display X, Display Y, Length, Color1, Color2
// Set Length to 0 to disable
ROOM=13,1,20,10,17
TOPIC=42,1,80,10,17
SCROLL=65,2,0,10,17
LATENCY=80,50,3,10,17
CHATTERS=49,50,3,10,17
BUFFER=98,50,3,10,17
HEARTBEAT=129,50,1,7,17
MENTIONS=120,50,3,10,17
CLOCK=2,50,6,10,17
BBSES=20,50,3,10,17
ROOMS=35,50,2,10,17
ACTIVITY=67,50,3,10,17

// Visual elements theming (only use last 2 bytes for fg/bg)
HEARTGOOD=0,0,0,10,17
HEARTBAD=0,0,0,12,17

// Inputbar background (Only use last byte as Chr)
INPUTBG=0,0,0,0,32

// Params (Normal FG, Normal BG, Direct FG, Direct BG, Chr)
CURSOR=7,24,15,28,95