# .github/workflows/docker-build.yml
#
# Optional/secondary to the main containerization work -- builds the
# shared ANetBBS image and runs the existing pytest suite inside it as
# a smoke test. This is the FIRST CI workflow in this repo; nothing
# here is required for the Docker deployment itself to work.
#
# On every push/PR: build (amd64 only, for speed) + run tests inside
# the built image. Never pushes anywhere.
#
# On a version tag push (v1.0b2.30 etc): ALSO builds multi-arch
# (amd64+arm64) and pushes to ghcr.io/anetonline/anetbbs using the
# repo's automatic GITHUB_TOKEN -- no manual secrets needed, but the
# repo's Settings -> Actions -> General -> Workflow permissions must
# have "Read and write permissions" enabled for package pushes to
# succeed. If that's not enabled, the push step fails loudly and the
# build/test steps above it are unaffected.

name: Docker build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: anetbbs:ci

      - name: Run test suite inside the built image
        # Batched, not a single `pytest tests/` invocation. Real CI
        # failure found live (2026-08-28, run 33169124736): the whole
        # suite in one process accumulates memory gradually across
        # roughly 440 files/2986 tests -- no single runaway test, just
        # ~5MB/file compounding to ~2.85GB by the end (confirmed via a
        # local reproduction with RSS sampled every 5s) -- and got OOM-
        # killed partway through on a constrained runner. Splitting into
        # 15 groups, each its own `python -m pytest` subprocess, resets
        # that accumulation between groups (matches the pattern already
        # used for safe local test runs on Jerry's dev machine -- see
        # feedback_safe_test_execution.md). `-x` is kept per group so a
        # real failure inside any one group still stops the job.
        #
        # Real CI-only failure found live (run 33174099347): piping
        # `ls` straight into `split -n l/N -d -` failed with "split: -:
        # cannot determine file size" on this image's coreutils (Debian
        # bookworm) -- `-n l/N` mode needs a seekable regular file to
        # compute even chunk boundaries, which a pipe isn't, even
        # though the equivalent piped command worked fine on the dev
        # machine's own coreutils. Listing to a real file first sidesteps
        # the whole seekability question regardless of coreutils version.
        run: |
          docker run --rm \
            -e FLASK_ENV=testing \
            anetbbs:ci \
            bash -c '
              set -e
              cd /app
              ls tests/*.py > /tmp/tfiles.txt
              split -n l/15 -d /tmp/tfiles.txt /tmp/tbatch_
              for f in /tmp/tbatch_*; do
                echo "=== batch $f ==="
                python -m pytest $(cat "$f") -x -q
              done
            '

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: ver
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build + push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/anetonline/anetbbs:${{ steps.ver.outputs.tag }}
            ghcr.io/anetonline/anetbbs:latest
