# .github/workflows/docker-build.yml
#
# Optional/secondary to the main containerization work -- builds the
# shared ANetBBS image and runs the existing pytest suite inside it as
# a smoke test. This is the FIRST CI workflow in this repo; nothing
# here is required for the Docker deployment itself to work.
#
# On every push/PR: build (amd64 only, for speed) + run tests inside
# the built image. Never pushes anywhere.
#
# On a version tag push (v1.0b2.30 etc): ALSO builds multi-arch
# (amd64+arm64) and pushes to ghcr.io/anetonline/anetbbs using the
# repo's automatic GITHUB_TOKEN -- no manual secrets needed, but the
# repo's Settings -> Actions -> General -> Workflow permissions must
# have "Read and write permissions" enabled for package pushes to
# succeed. If that's not enabled, the push step fails loudly and the
# build/test steps above it are unaffected.

name: Docker build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: anetbbs:ci

      - name: Run test suite inside the built image
        run: |
          docker run --rm \
            -e FLASK_ENV=testing \
            anetbbs:ci \
            python -m pytest tests/ -x -q

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: ver
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build + push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/anetonline/anetbbs:${{ steps.ver.outputs.tag }}
            ghcr.io/anetonline/anetbbs:latest
