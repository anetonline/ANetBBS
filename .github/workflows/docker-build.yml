# .github/workflows/docker-build.yml
#
# Optional/secondary to the main containerization work -- builds the
# shared ANetBBS image and runs the existing pytest suite inside it as
# a smoke test. This is the FIRST CI workflow in this repo; nothing
# here is required for the Docker deployment itself to work.
#
# On every push/PR: build (amd64 only, for speed) + run tests inside
# the built image. Never pushes anywhere.
#
# On a version tag push (1.1.72 or v1.1.72): ALSO builds multi-arch
# (amd64+arm64) and pushes to ghcr.io/anetonline/anetbbs using the
# repo's automatic GITHUB_TOKEN -- no manual secrets needed, but the
# repo's Settings -> Actions -> General -> Workflow permissions must
# have "Read and write permissions" enabled for package pushes to
# succeed. If that's not enabled, the push step fails loudly and the
# build/test steps above it are unaffected.

name: Docker build

on:
  push:
    branches: [main]
    # The repo's sync_to_github.sh creates bare version tags (1.1.72).
    # Keep accepting the conventional v-prefixed form too.
    tags: ['v*', '*.*.*']
  pull_request:
    branches: [main]
  # Manual run: build, test and (optionally) publish an EXISTING release
  # tag's tree with this workflow definition. Used when a tag's own push
  # run failed for a CI-environment reason and its images never reached
  # GHCR. It never creates or moves a tag.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build (e.g. v1.1.76); empty = this ref'
        required: false
        default: ''
      publish:
        description: 'Push the tested image to GHCR'
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}

      - name: Verify the checkout is the requested release tag
        if: inputs.release_tag != ''
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$INPUT_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $INPUT_TAG"; exit 1; }
          want="$(git rev-parse "refs/tags/$INPUT_TAG^{commit}")"
          echo "requested $INPUT_TAG = $want; checked out $(git rev-parse HEAD); workflow from $GITHUB_SHA"
          [ "$(git rev-parse HEAD)" = "$want" ] || { echo "checkout is not $INPUT_TAG"; exit 1; }

      - name: Check in-image test inputs (fails fast, before the build)
        # The in-image run below cannot see files .dockerignore excludes.
        # This checkout-side guard fails if a test reads such a file
        # without the test step mounting it (see the test step's notes).
        run: |
          if [ ! -f tests/test_docker_ci_test_inputs.py ]; then
            # Older release tags predate the guard; the in-image run below
            # still fails on any missing input.
            echo "guard not in this tree ($(git rev-parse --short HEAD)); skipping the pre-check"
            exit 0
          fi
          python3 -m venv /tmp/guard-venv
          /tmp/guard-venv/bin/pip install --quiet pyyaml
          /tmp/guard-venv/bin/python -m unittest discover -s tests -p test_docker_ci_test_inputs.py -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: anetbbs:ci

      - name: Run test suite inside the built image
        # Batched, not a single `pytest tests/` invocation. Real CI
        # failure found live (2026-08-28, run 33169124736): the whole
        # suite in one process accumulates memory gradually across
        # roughly 440 files/2986 tests -- no single runaway test, just
        # ~5MB/file compounding to ~2.85GB by the end (confirmed via a
        # local reproduction with RSS sampled every 5s) -- and got OOM-
        # killed partway through on a constrained runner. Splitting into
        # 15 groups, each its own `python -m pytest` subprocess, resets
        # that accumulation between groups (matches the pattern already
        # used for safe local test runs on Jerry's dev machine -- see
        # feedback_safe_test_execution.md). `-x` is kept per group so a
        # real failure inside any one group still stops the job.
        #
        # Real CI-only failure found live (run 33174099347): piping
        # `ls` straight into `split -n l/N -d -` failed with "split: -:
        # cannot determine file size" on this image's coreutils (Debian
        # bookworm) -- `-n l/N` mode needs a seekable regular file to
        # compute even chunk boundaries, which a pipe isn't, even
        # though the equivalent piped command worked fine on the dev
        # machine's own coreutils. Listing to a real file first sidesteps
        # the whole seekability question regardless of coreutils version.
        #
        # Real CI failure found live (v1.1.76 push, runs 45851106977 and
        # 45851106629): .dockerignore keeps deploy/sudoers.anetbbs out of
        # the runtime image (bare-metal only), but the H-1 security test
        # reads that template. The test is not skipped or weakened: the
        # checkout's own copy is mounted read-only at the same path, so
        # the test checks exactly the file that ships in the release.
        # tests/test_docker_ci_test_inputs.py fails if a test starts
        # reading another dockerignored repo file without a mount here.
        run: |
          docker run --rm \
            -e FLASK_ENV=testing \
            -v "$PWD/deploy/sudoers.anetbbs:/app/deploy/sudoers.anetbbs:ro" \
            anetbbs:ci \
            bash -c '
              set -e
              cd /app
              ls tests/*.py > /tmp/tfiles.txt
              split -n l/15 -d /tmp/tfiles.txt /tmp/tbatch_
              for f in /tmp/tbatch_*; do
                echo "=== batch $f ==="
                python -m pytest $(cat "$f") -x -q
              done
            '

  publish:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.release_tag != '')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}
          fetch-depth: 0

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: ver
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $tag"; exit 1; }
          # the checked-out tree must be exactly that tag
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$tag^{commit}")" ] || { echo "HEAD is not $tag"; exit 1; }
          newest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$tag" = "$newest" ]; then
            echo "tags=ghcr.io/anetonline/anetbbs:$tag,ghcr.io/anetonline/anetbbs:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/anetonline/anetbbs:$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.tags }}
          # Lets anyone confirm from the registry which commit an image was built from.
          labels: |
            org.opencontainers.image.revision=${{ steps.ver.outputs.revision }}
            org.opencontainers.image.version=${{ steps.ver.outputs.tag }}
            org.opencontainers.image.source=https://github.com/anetonline/ANetBBS
